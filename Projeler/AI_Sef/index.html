<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Şef - En Kolay Yemek Rehberi</title>
    <!-- Modern Typography: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- Ana Konteyner -->
      <div class="glass-container">
        
        <!-- Üst Başlık (Header) -->
        <header class="header">
          <div class="logo">
            <span class="emoji">🍳</span>
            <h1>AI Şef</h1>
          </div>
          <p class="subtitle">Yemek yapmayı bilmeyenler için aşırı basit rehber</p>
        </header>

        <!-- Karşılama ve Arama Bölümü -->
        <main class="main-content" id="home-view">
          <div class="hero-section">
            <h2>Bugün ne pişirelim?</h2>
            <p>Dolaptaki malzemelerini yaz veya önerdiğimiz garanti tariflerden birini seç.</p>
            
            <div class="search-box">
              <input type="text" id="ingredient-input" placeholder="Örn: Tavuk, domates, makarna..." autocomplete="off" />
              <button id="ai-generate-btn" class="primary-btn">
                <span class="magic-icon">✨</span> AI ile Tarif Bul
              </button>
            </div>
          </div>

          <div class="saved-recipes hidden" id="saved-recipes-section">
            <h3>🔖 Kaydettiğin Tarifler</h3>
            <div class="recipe-cards" id="saved-recipe-cards">
              <!-- JS ile doldurulacak -->
            </div>
          </div>

          <div class="quick-recipes">
            <h3>Asla Hata Yapmayacağın 3 Tarif</h3>
            <div class="recipe-cards" id="quick-recipe-cards">
              <!-- JS ile doldurulacak -->
            </div>
          </div>
        </main>

        <!-- Tarif Adım Adım (Carousel) Görünümü -->
        <section class="recipe-view hidden" id="recipe-view">
           <!-- JS ile doldurulacak -->
        </section>

      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
