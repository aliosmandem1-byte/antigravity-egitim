<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KitchAI - Akıllı Mutfak Asistanın</title>
    <!-- Modern Typography: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- Ana Konteyner -->
      <div class="glass-container">
        
        <!-- Üst Başlık (Header) -->
        <header class="header">
          <div class="logo-area">
            <div class="logo">
              <span class="emoji">🍳</span>
              <h1>KitchAI</h1>
            </div>
            <p class="subtitle" data-i18n="headerSubtitle">Yemek yapmayı bilmeyenler için aşırı basit rehber</p>
          </div>
          <div class="header-controls">
            <div class="persona-wrapper">
              <select id="persona-select" class="glass-dropdown">
                <option value="standart" data-i18n="chefStandart">👨‍🍳 Standart Şef</option>
                <option value="angry" data-i18n="chefAngry">🤬 Sinirli Şef (Ramsay)</option>
                <option value="mom" data-i18n="chefMom">👵 Sevecen Anne</option>
                <option value="student" data-i18n="chefStudent">🎓 Üşengeç Öğrenci</option>
              </select>
              <p id="persona-hint" class="persona-hint">Her türlü yemeği tam ölçüsüyle profesyonelce anlatır.</p>
            </div>
            <select id="language-select" class="glass-dropdown">
              <option value="tr">🇹🇷 TR</option>
              <option value="en">🇬🇧 EN</option>
              <option value="de">🇩🇪 DE</option>
              <option value="es">🇪🇸 ES</option>
            </select>
          </div>
        </header>

        <!-- Karşılama ve Arama Bölümü -->
        <main class="main-content" id="home-view">
          <div class="hero-section">
            <h2 data-i18n="heroTitle">Bugün ne pişirelim?</h2>
            <p data-i18n="heroSubtitle">Dolaptaki malzemelerini yaz veya önerdiğimiz garanti tariflerden birini seç.</p>
            
            <div class="search-box">
              <input type="text" id="ingredient-input" placeholder="Örn: Tavuk, domates, makarna..." autocomplete="off" />
              <button id="ai-generate-btn" class="primary-btn">
                <span class="magic-icon">✨</span> <span data-i18n="generateBtn">AI ile Tarif Bul</span>
              </button>
            </div>
          </div>

          <div class="saved-recipes hidden" id="saved-recipes-section">
            <h3 data-i18n="savedRecipesTitle">🔖 Kaydettiğin Tarifler</h3>
            <div class="recipe-cards" id="saved-recipe-cards">
              <!-- JS ile doldurulacak -->
            </div>
          </div>
        </main>

        <!-- Tarif Adım Adım (Carousel) Görünümü -->
        <section class="recipe-view hidden" id="recipe-view">
           <!-- JS ile doldurulacak -->
        </section>

      </div>
    </div>
    <script type="module" src="/main.js?v=2"></script>
  </body>
</html>
